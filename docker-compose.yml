# =============================================================
# RESOURCE TUNING NOTES (last revised: 2026-09-21)
# -------------------------------------------------------------
# Host: Manjaro, 8 GB RAM. Docker budget ~3.5 GB.
#
# Key changes from the original compose:
#   - Keycloak: 512M → 1024M, plus JAVA_OPTS_APPEND with -Xmx512m.
#     Original 512M cap caused JVM SIGSEGV under load. Heap must stay
#     well under the container limit; -Xmx controls that.
#   - Novu ws/worker: 160M → 256M (were running at 91-98%).
#   - Novu API: 384M → 448M. Novu dashboard: 96M → 128M.
#   - Novu mongo-express: 100M → 160M.
#   - Postgres: 128M → 256M each (baseline is ~80-100M).
#   - pgAdmin: 512M → 384M (it's a UI; 512M was overkill).
#
# Do NOT add -XX:+UseSerialGC to JAVA_OPTS_APPEND — the Keycloak image
# already sets a GC; a second one aborts JVM startup.
# =============================================================

services:
  # ----------------------------------------------------
  # 1. KEYCLOAK SERVICE
  # ----------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.2
    container_name: mhf-keycloak
    # start-dev for local only; use `start --optimized` for production.
    command: start-dev --import-realm
    ports:
      - "9080:8080"                # host 9080 → container 8080
    environment:
      KEYCLOAK_ADMIN: mhf-temp-admin
      KEYCLOAK_ADMIN_PASSWORD: mhf-temp-password     # local dev only
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_password              # local dev only

      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      # Hostname v2 (replaces deprecated KC_HOSTNAME_URL / KC_PROXY).
      KC_HOSTNAME: http://localhost:9080
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: xforwarded

      # -Xmx512m keeps heap under the 1024M container, leaving room for
      # Infinispan off-heap + native. See header note re: -XX:+UseSerialGC.
      JAVA_OPTS_APPEND: "-Xms256m -Xmx512m -XX:MaxMetaspaceSize=160m -XX:MaxDirectMemorySize=48m"

    volumes:
      - ./keycloak/mentalhealthforum-realm.json:/opt/keycloak/data/import/mentalhealthforum-realm.json
      - ./keycloak/themes:/opt/keycloak/themes

    depends_on:
      keycloak-db:
        condition: service_healthy

    restart: always
    deploy:
      resources:
        limits:
          memory: 1024M

  # ----------------------------------------------------
  # 2. KEYCLOAK POSTGRES DATABASE
  # ----------------------------------------------------
  keycloak-db:
    image: postgres:16-alpine
    container_name: mhf-keycloak-db
    ports:
      - "5433:5432"                # 5433 avoids clash with local Postgres
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: keycloak_password

    volumes:
      - ./databases/keycloak-db:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak_user -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 5

    restart: always
    deploy:
      resources:
        limits:
          memory: 256M

  # ----------------------------------------------------
  # 3. FORUM POSTGRES DATABASE
  # ----------------------------------------------------
  forum-db:
    image: postgres:16-alpine
    container_name: mhf-forum-db
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: forum
      POSTGRES_USER: forum_user
      POSTGRES_PASSWORD: forum_password

    volumes:
      - ./databases/forum-db/data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forum_user -d forum"]
      interval: 5s
      timeout: 5s
      retries: 5

    restart: always
    deploy:
      resources:
        limits:
          memory: 256M

  # ----------------------------------------------------
  # 4. PGADMIN
  # ----------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: mhf-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@mhf.co
      PGADMIN_DEFAULT_PASSWORD: admin123
      # 1 worker keeps baseline RAM low; 2 threads still allow concurrent queries.
      PGADMIN_GUNICORN_WORKERS: 1
      PGADMIN_GUNICORN_THREADS: 2

    ports:
      - "5050:80"
    depends_on:
      - keycloak-db
      - forum-db
    healthcheck:
      # /misc/ping is pgAdmin's readiness endpoint. curl isn't present in
      # the image, so use wget; CMD-SHELL so `|| exit 1` is interpreted.
      test: [ "CMD-SHELL", "wget -q --spider http://localhost:80/misc/ping || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s  # pgAdmin takes ~15-25s to boot; don't flag it early

    restart: always
    deploy:
      resources:
        limits:
          memory: 384M

  # ----------------------------------------------------
  # 5. NOVU LEAN STACK
  # ----------------------------------------------------
  # 5.1 MongoDB for Novu
  mhf-novu-mongodb:
    image: mongo:4.4
    # Cap WiredTiger cache so Mongo doesn't grab ~50% of host RAM.
    command: mongod --wiredTigerCacheSizeGB 0.25
    ports:
      - "127.0.0.1:27017:27017"    # localhost-only
    container_name: mhf-novu-mongodb
    volumes:
      - ./databases/mhf-novu-mongodb:/data/db
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M

  # 5.2 Mongo Express for MongoDB
  mhf-novu-mongo-express:
    image: mongo-express
    container_name: mhf-novu-mongo-express
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mhf-novu-mongodb:27017/novu-db
      ME_CONFIG_BASICAUTH_ENABLED: "true"
      ME_CONFIG_BASICAUTH_USERNAME: admin@mhf.co
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
    ports:
      - "127.0.0.1:8091:8081"      # localhost-only
    depends_on:
      - mhf-novu-mongodb
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 160M

  # 5.3 Redis for Novu
  mhf-novu-redis:
    image: redis:alpine
    container_name: mhf-novu-redis
    restart: always
    deploy:
      resources:
        limits:
          memory: 96M

  # 5.4 Novu API Service
  mhf-novu-api:
    image: ghcr.io/novuhq/novu/api:2.1.1
    container_name: mhf-novu-api
    ports:
      - "3000:3000"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - NODE_ENV=local
      - MONGO_URL=mongodb://mhf-novu-mongodb:27017/novu-db
      - REDIS_URL=redis://mhf-novu-redis:6379
      - REDIS_HOST=mhf-novu-redis
      - REDIS_PORT=6379
      - JWT_SECRET=mhf_dev_secret_123
      - STORE_ENCRYPTION_KEY=12345678901234567890123456789012
      - FRONT_BASE_URL=http://localhost:4200
      - CORS_ALLOWED_ORIGINS=http://localhost:3001,http://localhost:3000,http://localhost:4200
      # Keep Node heap ~85% of the container limit.
      - NODE_OPTIONS=--max-old-space-size=384
    restart: always
    deploy:
      resources:
        limits:
          memory: 448M

  # 5.5 Novu Dashboard
  mhf-novu-dashboard:
    image: ghcr.io/novuhq/novu/web:2.1.1
    container_name: mhf-novu-dashboard
    ports:
      - "4200:4200"
    environment:
      - REACT_APP_API_URL=http://localhost:3000
      - REACT_APP_WS_URL=http://localhost:3002
    restart: always
    deploy:
      resources:
        limits:
          memory: 128M

  # 5.6 Novu WebSocket Service
  mhf-novu-ws:
    image: ghcr.io/novuhq/novu/ws:2.1.1
    container_name: mhf-novu-ws
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=local
      - PORT=3002
      - MONGO_URL=mongodb://mhf-novu-mongodb:27017/novu-db
      - REDIS_URL=redis://mhf-novu-redis:6379
      - REDIS_HOST=mhf-novu-redis
      - REDIS_PORT=6379
      - JWT_SECRET=mhf_dev_secret_123      # MUST match the API service
      - SOCKET_IO_PROTOCOL_VERSION=4
      - CORS_ALLOWED_ORIGINS=http://localhost:3001,http://localhost:4200,http://localhost:3000,http://127.0.0.1:3001
      - NODE_OPTIONS=--max-old-space-size=200
    restart: always
    deploy:
      resources:
        limits:
          # Was 160M and sat at 98%; bumped for headroom against bursts.
          memory: 256M

  # 5.7 Novu Worker Service
  mhf-novu-worker:
    image: ghcr.io/novuhq/novu/worker:2.1.1
    container_name: mhf-novu-worker
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - NODE_ENV=local
      - MONGO_URL=mongodb://mhf-novu-mongodb:27017/novu-db
      - REDIS_URL=redis://mhf-novu-redis:6379
      - REDIS_HOST=mhf-novu-redis
      - REDIS_PORT=6379
      - JWT_SECRET=mhf_dev_secret_123
      - STORE_ENCRYPTION_KEY=12345678901234567890123456789012
      - NODE_OPTIONS=--max-old-space-size=200
    restart: always
    deploy:
      resources:
        limits:
          # Was 160M and sat at 91%; sends admin email MFA — must not OOM.
          memory: 256M


  # ----------------------------------------------------
  # 6. MAILPIT — local SMTP catch-all for dev email testing
  # ----------------------------------------------------
  # ----------------------------------------------------
  # Replaces Ethereal guest inboxes, whose credentials rotate per session and force reconfiguring Novu daily.
  # Mailpit catches all SMTP on 1025 and displays messages at http://localhost:8025 — no external service,
  # no credentials to manage, no send limits. Messages are held in memory
  # and cleared on container restart (intentional; they're throwaway tests)
  mailpit:
    image: axllent/mailpit
    container_name: mhf-mailpit
    ports:
      - "1025:1025"                # SMTP — point Novu/apps here
      - "8025:8025"                # Web UI — view caught emails
    environment:
      # Keep messages in memory; no need to persist test emails.
      MP_MAX_MESSAGES: 500               # cap in-memory message count
      MP_SMTP_AUTH_ACCEPT_ANY: 1         # accept any username/password (or none)
      MP_SMTP_AUTH_ALLOW_INSECURE: 1     # allow plain SMTP auth (local only)
    restart: always
    deploy:
      resources:
        limits:
          memory: 64M

# ----------------------------------------------------
# NETWORK CONFIGURATION
# ----------------------------------------------------
networks:
  default:
    name: mhf-network
    driver: bridge